owner: Kaychewe
repo: ariexa-status-page

sites:
  - name: Ariexa
    url: https://app.ariexa.com

status-website:
  cname: status.ariexa.com
  logoUrl: https://app.ariexa.com/static/images/branding/logos/logo-primary.png
  name: Ariexa Status
  introTitle: "**Ariexa** service status and uptime history."
  introMessage: Live status for Ariexa, checked every 5 minutes via GitHub Actions.
  navbar:
    - title: Status
      href: /
    - title: Ariexa
      href: https://app.ariexa.com

# Two different config sections use two different keys for a link, verified
# against source, not guessed:
#   sites[].url    -- read by uptime-monitor's checker (src/update.ts et al)
#   navbar[].href  -- read by the SEPARATE @upptime/status-page renderer's
#                     Nav.svelte (does item.href.replace("$OWNER", ...))
# Mixing these up breaks the site build with a silent 32-byte
# "Internal server error" export or a "Checking undefined" crash.

# See https://upptime.js.org/docs/configuration for notifications, assigning
# issues, and more.
