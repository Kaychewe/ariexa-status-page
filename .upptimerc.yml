# Visual theme lives in assets/ (global.css, themes/light.css, themes/dark.css)
# -- Upptime copies that directory over the built site verbatim, since
# .upptimerc.yml itself has no css/theme config keys (see
# github.com/upptime/uptime-monitor/blob/master/src/interfaces.ts and
# github.com/upptime/uptime-monitor/blob/master/src/site.ts).

# See https://upptime.js.org/docs/configuration for notifications, assigning
# issues, and more.
